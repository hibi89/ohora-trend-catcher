name: P6 C Contract Offline
on:
  pull_request:
    paths:
      - 'raw_v2/three_api_runtime_contract.py'
      - 'tests/test_three_api_runtime_contract.py'
      - '.github/workflows/p6-c-contract-offline.yml'
  push:
    branches:
      - feature/p6-c-runtime-20261019
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile contract and tests
        run: python -m py_compile raw_v2/three_api_runtime_contract.py tests/test_three_api_runtime_contract.py
      - name: Offline contract regressions
        run: python -m unittest discover -s tests -p 'test_three_api_runtime_contract.py' -v
