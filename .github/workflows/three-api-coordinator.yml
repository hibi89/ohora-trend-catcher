name: Three API offline tests

on:
  push:
    paths:
      - 'raw_v2/three_api_coordinator.py'
      - 'raw_v2/three_api_adapter.py'
      - 'raw_v2/three_api_checkpoints.py'
      - 'raw_v2/three_api_paging.py'
      - 'raw_v2/three_api_evidence.py'
      - 'raw_v2/three_api_offline_runner.py'
      - 'raw_v2/three_api_meta_normalizer.py'
      - 'raw_v2/three_api_usage.py'
      - 'raw_v2/three_api_http_fixture.py'
      - 'raw_v2/three_api_request_spec.py'
      - 'raw_v2/three_api_credentials.py'
      - 'raw_v2/three_api_http_preflight.py'
      - 'tests/test_three_api_coordinator.py'
      - 'tests/test_three_api_adapter.py'
      - 'tests/test_three_api_checkpoints.py'
      - 'tests/test_three_api_paging.py'
      - 'tests/test_three_api_evidence.py'
      - 'tests/test_three_api_offline_runner.py'
      - 'tests/test_three_api_meta_normalizer.py'
      - 'tests/test_three_api_usage.py'
      - 'tests/test_three_api_http_fixture.py'
      - 'tests/test_three_api_envelope_runner.py'
      - 'tests/test_three_api_policy_hardening.py'
      - 'tests/test_three_api_request_spec.py'
      - 'tests/test_three_api_credentials.py'
      - 'tests/test_three_api_http_preflight.py'
      - '.github/workflows/three-api-coordinator.yml'
  pull_request:
    paths:
      - 'raw_v2/three_api_coordinator.py'
      - 'raw_v2/three_api_adapter.py'
      - 'raw_v2/three_api_checkpoints.py'
      - 'raw_v2/three_api_paging.py'
      - 'raw_v2/three_api_evidence.py'
      - 'raw_v2/three_api_offline_runner.py'
      - 'raw_v2/three_api_meta_normalizer.py'
      - 'raw_v2/three_api_usage.py'
      - 'raw_v2/three_api_http_fixture.py'
      - 'raw_v2/three_api_request_spec.py'
      - 'raw_v2/three_api_credentials.py'
      - 'raw_v2/three_api_http_preflight.py'
      - 'tests/test_three_api_coordinator.py'
      - 'tests/test_three_api_adapter.py'
      - 'tests/test_three_api_checkpoints.py'
      - 'tests/test_three_api_paging.py'
      - 'tests/test_three_api_evidence.py'
      - 'tests/test_three_api_offline_runner.py'
      - 'tests/test_three_api_meta_normalizer.py'
      - 'tests/test_three_api_usage.py'
      - 'tests/test_three_api_http_fixture.py'
      - 'tests/test_three_api_envelope_runner.py'
      - 'tests/test_three_api_policy_hardening.py'
      - 'tests/test_three_api_request_spec.py'
      - 'tests/test_three_api_credentials.py'
      - 'tests/test_three_api_http_preflight.py'
      - '.github/workflows/three-api-coordinator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all three-API modules and tests
        run: |
          python -m py_compile raw_v2/three_api_coordinator.py raw_v2/three_api_adapter.py raw_v2/three_api_checkpoints.py raw_v2/three_api_paging.py raw_v2/three_api_evidence.py raw_v2/three_api_offline_runner.py raw_v2/three_api_meta_normalizer.py raw_v2/three_api_usage.py raw_v2/three_api_http_fixture.py raw_v2/three_api_request_spec.py raw_v2/three_api_credentials.py raw_v2/three_api_http_preflight.py
          python -m py_compile tests/test_three_api_coordinator.py tests/test_three_api_adapter.py tests/test_three_api_checkpoints.py tests/test_three_api_paging.py tests/test_three_api_evidence.py tests/test_three_api_offline_runner.py tests/test_three_api_meta_normalizer.py tests/test_three_api_usage.py tests/test_three_api_http_fixture.py tests/test_three_api_envelope_runner.py tests/test_three_api_policy_hardening.py tests/test_three_api_request_spec.py tests/test_three_api_credentials.py tests/test_three_api_http_preflight.py
      - name: Run three-API offline regression suites
        run: |
          python -m unittest discover -s tests -p 'test_three_api_coordinator.py' -v
          python -m unittest discover -s tests -p 'test_three_api_adapter.py' -v
          python -m unittest discover -s tests -p 'test_three_api_checkpoints.py' -v
          python -m unittest discover -s tests -p 'test_three_api_paging.py' -v
          python -m unittest discover -s tests -p 'test_three_api_evidence.py' -v
          python -m unittest discover -s tests -p 'test_three_api_offline_runner.py' -v
          python -m unittest discover -s tests -p 'test_three_api_meta_normalizer.py' -v
          python -m unittest discover -s tests -p 'test_three_api_usage.py' -v
          python -m unittest discover -s tests -p 'test_three_api_http_fixture.py' -v
          python -m unittest discover -s tests -p 'test_three_api_envelope_runner.py' -v
          python -m unittest discover -s tests -p 'test_three_api_policy_hardening.py' -v
          python -m unittest discover -s tests -p 'test_three_api_request_spec.py' -v
          python -m unittest discover -s tests -p 'test_three_api_credentials.py' -v
          python -m unittest discover -s tests -p 'test_three_api_http_preflight.py' -v
