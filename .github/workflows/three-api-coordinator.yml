name: Three API coordinator offline tests

on:
  push:
    paths:
      - 'raw_v2/three_api_coordinator.py'
      - 'tests/test_three_api_coordinator.py'
      - '.github/workflows/three-api-coordinator.yml'
  pull_request:
    paths:
      - 'raw_v2/three_api_coordinator.py'
      - 'tests/test_three_api_coordinator.py'
      - '.github/workflows/three-api-coordinator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile coordinator and tests
        run: python -m py_compile raw_v2/three_api_coordinator.py tests/test_three_api_coordinator.py
      - name: Run offline coordinator regression suite
        run: python -m unittest discover -s tests -p 'test_three_api_coordinator.py' -v
