  push:
    paths:
      - 'raw_v2/three_api_capture.py'
      - 'raw_v2/three_api_response_evidence.py'
      - 'raw_v2/three_api_contract_executor.py'
      - 'raw_v2/three_api_runtime_contract.py'
      - 'raw_v2/three_api_p2_clone_migration.py'
      - 'raw_v2/three_api_observation_versions.py'
