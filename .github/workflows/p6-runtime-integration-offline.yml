      - 'raw_v2/three_api_paging.py'
      - 'raw_v2/three_api_request_spec.py'
      - 'raw_v2/three_api_usage.py'
      - 'tests/test_three_api_capture.py'
      - 'tests/test_three_api_contract_executor.py'
      - 'tests/test_three_api_p1_response_evidence.py'
      - 'tests/test_three_api_runtime_contract.py'
      - 'tests/test_three_api_p2_clone_migration.py'
      - 'tests/test_three_api_p2_observations.py'
      - 'tests/test_three_api_reel_metrics.py'
      - 'tests/test_three_api_raw_writer.py'
      - 'tests/test_three_api_transport.py'
      - 'raw_v2/three_api_daily_orchestrator.py'
      - 'raw_v2/three_api_daily_projection.py'
      - 'raw_v2/three_api_daily_gap.py'
      - 'tests/test_three_api_full_roster_batch.py'
      - 'tests/test_three_api_daily_orchestrator.py'
      - 'tests/test_three_api_daily_gap.py'
      - 'raw_v2/three_api_epochs.py'
      - 'raw_v2/three_api_history_cutoff_audit.py'
      - 'tests/test_three_api_history_cutoff_audit.py'
      - 'raw_v2/three_api_epoch_contract_projection.py'
      - 'raw_v2/three_api_history_fixture_ingress.py'
      - 'tests/test_three_api_history_contract_offline.py'
      - 'tests/test_three_api_epoch_contract_projection.py'
      - 'raw_v2/three_api_coordinator.py'
      - 'raw_v2/three_api_evidence.py'
      - 'raw_v2/three_api_job_binding.py'
      - 'raw_v2/three_api_adapter_guard.py'
      - 'tests/test_three_api_epochs.py'
      - 'tests/test_three_api_job_binding.py'
      - 'tests/run_offline.py'
      - '.github/workflows/p6-runtime-integration-offline.yml'
  workflow_dispatch:

concurrency:
  group: p6-runtime-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-runtime:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile runtime modules and tests
        run: |
          python -m py_compile \
            raw_v2/three_api_capture.py \
            raw_v2/three_api_response_evidence.py \
            raw_v2/three_api_contract_executor.py \
            raw_v2/three_api_runtime_contract.py \
            raw_v2/three_api_raw_writer.py \
            raw_v2/three_api_epochs.py \
            raw_v2/three_api_history_cutoff_audit.py \
            raw_v2/three_api_epoch_contract_projection.py \
            raw_v2/three_api_history_fixture_ingress.py \
            raw_v2/three_api_observation_versions.py \
            raw_v2/three_api_p2_clone_migration.py \
            raw_v2/three_api_transport.py \
            tests/test_three_api_contract_executor.py \
            tests/test_three_api_p1_response_evidence.py \
            tests/test_three_api_runtime_contract.py \
            tests/test_three_api_raw_writer.py \
            tests/test_three_api_epochs.py \
            tests/test_three_api_history_cutoff_audit.py \
            tests/test_three_api_epoch_contract_projection.py \
            tests/test_three_api_history_contract_offline.py \
            tests/test_three_api_p2_observations.py \
            tests/test_three_api_reel_metrics.py \
            tests/test_three_api_p2_clone_migration.py \
            tests/test_three_api_transport.py
      - name: Audit discovered offline test inventory
        run: python tests/run_offline.py --list-groups
      - name: Run complete offline regression suite with sockets blocked
        run: python tests/run_offline.py

  offline-windows:
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    # Each Windows group runs on an isolated runner. All discovered test modules
    # are assigned to exactly one group in tests/run_offline.py. This preserves
    # the full socket-blocked suite while parallelizing expensive SQLite tests.
    # No repository secrets, Meta calls, or production database connections.
    name: offline-windows (${{ matrix.group }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [orchestrator, roster, report, observations, remaining]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile offline modules and tests on Windows
        run: python -m compileall -q raw_v2 tests
      - name: Audit Windows offline test inventory
        run: python tests/run_offline.py --list-groups
      - name: Run socket-blocked Windows regression group
        env:
          OFFLINE_TEST_WATCHDOG_SECONDS: '180'
        run: python -u tests/run_offline.py --group ${{ matrix.group }}
