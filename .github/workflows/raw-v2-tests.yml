name: OHORA RAW v2 Offline Tests
on:
  push:
    paths:
      - 'raw_v2/**'
      - 'tests/test_raw_v2.py'
      - 'tests/test_daily_scheduler.py'
      - 'tests/test_raw_integrity.py'
      - 'tests/test_batch_recovery.py'
      - 'tests/test_audit.py'
      - 'tests/run_offline.py'
      - 'tests/test_three_api_catchup_offline.py'
      - 'tests/test_three_api_catchup_payload.py'
      - 'tests/test_three_api_carousel_children.py'
      - 'tests/test_three_api_carousel_optin.py'
      - 'tests/test_three_api_raw_mirror.py'
      - 'tests/test_three_api_raw_projection.py'
      - '.github/workflows/raw-v2-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated no-network RAW v2 tests
        run: python tests/run_offline.py
