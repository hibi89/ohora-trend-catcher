name: P50 v2 offline tests
on:
  push:
    branches:
      - feature/p50-v2-standalone-collector-20261023
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile standalone modules
        run: python -m py_compile raw_v2/p50_cycle_engine_v2.py raw_v2/p50_v2_collector.py raw_v2/p50_quota_policy.py
      - name: Run P50 cycle tests
        run: python -m unittest discover -s tests -p 'test_p50_cycle_v2.py' -v
